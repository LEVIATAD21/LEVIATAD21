  <g class="tile" transform="translate(390 82)"><rect width="160" height="132" rx="18" fill="#0b1726" stroke="#6d28d9"/><text x="18" y="34" font-size="23" fill="#a78bfa">▯</text><text x="18" y="62" font-weight="700" font-size="16" fill="#f1f5f9">Mobile</text><text x="18" y="87" font-size="12" fill="#94a3b8">React Native</text><text x="18" y="106" font-size="12" fill="#94a3b8">Expo</text></g>
  <g class="tile" transform="translate(568 82)"><rect width="160" height="132" rx="18" fill="#0b1726" stroke="#2563eb"/><text x="18" y="34" font-size="22" fill="#60a5fa">◫</text><text x="18" y="62" font-weight="700" font-size="16" fill="#f1f5f9">Dados</text><text x="18" y="87" font-size="12" fill="#94a3b8">PostgreSQL • SQLite</text><text x="18" y="106" font-size="12" fill="#94a3b8">Prisma • Supabase</text></g>
  <g class="tile" transform="translate(746 82)"><rect width="160" height="132" rx="18" fill="#0b1726" stroke="#7c3aed"/><text x="18" y="34" font-size="22" fill="#c084fc">⬡</text><text x="18" y="62" font-weight="700" font-size="16" fill="#f1f5f9">Segurança</text><text x="18" y="87" font-size="12" fill="#94a3b8">Auditoria • Autenticação</text><text x="18" y="106" font-size="12" fill="#94a3b8">Validação • Acesso</text></g>
