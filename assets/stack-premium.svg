<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 245" role="img" aria-labelledby="title desc">
<title id="title">Stack principal</title><desc id="desc">Seis áreas principais: backend, frontend, mobile, dados, segurança e DevOps.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111d"/><stop offset=".55" stop-color="#091726"/><stop offset="1" stop-color="#11132a"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<filter id="premiumGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>/* premium-motion-v2 */.tile{animation:tilePulse 4s ease-in-out infinite}.tile text:first-of-type{filter:url(#premiumGlow)}@keyframes tilePulse{0%,100%{opacity:.9}50%{opacity:1}}</style></defs>
<rect width="1120" height="245" rx="24" fill="url(#bg)"/><rect x=".75" y=".75" width="1118.5" height="243.5" rx="23" fill="none" stroke="#1e3a5f"/>
