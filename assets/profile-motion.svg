<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Kawã Silva — Desenvolvedor de Software</title>
  <desc id="desc">Banner animado em tons escuros e ciano com uma janela de terminal, conexões e o foco profissional em backend, desenvolvimento full-stack e fundamentos de segurança da informação.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0b2031"/>
      <stop offset="1" stop-color="#10172d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#22d3ee" stop-opacity=".23"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 7 12; animation: flow 5s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.5s ease-in-out infinite; }
      .pulse2 { animation-delay: .7s; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      .terminalLine { animation: reveal 5s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -152; } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.13); } }
      @keyframes blink { to { opacity: 0; } }
      @keyframes reveal { 0%,12% { opacity: .25; } 22%,80% { opacity: 1; } 100% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="1280" height="360" rx="26" fill="url(#background)"/>
  <rect width="1280" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="185" cy="180" r="220" fill="url(#halo)"/>
  <circle cx="1110" cy="45" r="190" fill="#7c3aed" opacity=".07"/>
  <path d="M0 315 C220 270 310 350 510 302 S840 260 1280 310" stroke="#22d3ee" stroke-opacity=".11" fill="none" stroke-width="2"/>
  <g transform="translate(66 78)">
    <rect x="0" y="0" width="8" height="165" rx="4" fill="url(#accent)"/>
    <text x="32" y="57" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="1.5" fill="#f0f9ff">KAWÃ SILVA</text>
    <text x="34" y="93" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#67e8f9">DESENVOLVEDOR DE SOFTWARE JÚNIOR</text>
    <text x="34" y="127" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#c6d9e8">Backend · Full-Stack · Segurança da Informação</text>
    <text x="34" y="164" font-family="monospace" font-size="13" fill="#7f9bb3">BUILD  /  LEARN  /  IMPROVE</text>
  </g>
  <g transform="translate(760 58)">
    <rect width="448" height="244" rx="16" fill="#081521" stroke="#28536c" stroke-width="1.5"/>
    <path d="M0 45H448" stroke="#28536c" stroke-width="1"/>
    <circle cx="23" cy="23" r="5" fill="#fb7185"/>
    <circle cx="41" cy="23" r="5" fill="#fbbf24"/>
    <circle cx="59" cy="23" r="5" fill="#34d399"/>
    <text x="82" y="28" font-family="monospace" font-size="12" fill="#92adbf">kawa@dev: ~/profile</text>
    <g font-family="monospace" font-size="14">
      <text x="25" y="80" fill="#67e8f9">$</text>
      <text x="43" y="80" fill="#e5f3fc">whoami</text>
      <text x="25" y="108" fill="#a8c3d7">Kawã Silva</text>
      <text x="25" y="145" fill="#67e8f9">$</text>
      <text x="43" y="145" fill="#e5f3fc">focus --current</text>
      <text x="25" y="173" fill="#a8c3d7">backend | full-stack | security</text>
      <text x="25" y="210" fill="#67e8f9">$</text>
      <text x="43" y="210" fill="#e5f3fc">status</text>
      <text x="25" y="232" fill="#34d399" class="terminalLine">learning, building, documenting</text>
      <rect class="cursor" x="297" y="218" width="8" height="17" rx="1" fill="#67e8f9"/>
    </g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="2" stroke-opacity=".75">
    <path class="flow" d="M550 103H650Q692 103 692 145V197Q692 219 716 219H760"/>
    <path class="flow" d="M550 258H630Q670 258 670 232V211Q670 190 695 190H760"/>
  </g>
  <g fill="#67e8f9" filter="url(#glow)">
    <circle class="pulse" cx="550" cy="103" r="5"/>
    <circle class="pulse pulse2" cx="550" cy="258" r="5"/>
    <circle class="pulse" cx="760" cy="219" r="5"/>
  </g>
  <text x="68" y="328" font-family="monospace" font-size="11" letter-spacing="1.1" fill="#7298ad">PYTHON · TYPESCRIPT · LINUX · AUTOMATION</text>
</svg>