<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Kawã Silva — Full Stack, Backend e Segurança da Informação</title>
<desc id="desc">Banner premium em tons escuros, ciano, azul e roxo, com terminal e foco em desenvolvimento full stack, backend e segurança.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b14"/><stop offset=".55" stop-color="#071827"/><stop offset="1" stop-color="#14112c"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <radialGradient id="cyanHalo"><stop stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="purpleHalo"><stop stop-color="#8b5cf6" stop-opacity=".2"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#67e8f9" stroke-opacity=".035"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .flow{stroke-dasharray:8 12;animation:flow 5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.cursor{animation:blink 1s steps(2,start) infinite}
    @keyframes flow{to{stroke-dashoffset:-160}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}@keyframes blink{to{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .heroPulse{animation:heroPulse 3.2s ease-in-out infinite}.waveMove{stroke-dasharray:14 10;animation:waveMove 10s linear infinite}.terminalGlow{animation:terminalGlow 2.8s ease-in-out infinite}@keyframes heroPulse{0%,100%{opacity:.72}50%{opacity:1}}@keyframes waveMove{to{stroke-dashoffset:-240}}@keyframes terminalGlow{0%,100%{filter:drop-shadow(0 0 2px #22d3ee55)}50%{filter:drop-shadow(0 0 10px #22d3eeaa)}}
  </style>
</defs>
<rect width="1280" height="360" rx="28" fill="url(#bg)"/>
<rect width="1280" height="360" rx="28" fill="url(#grid)"/>
<circle cx="180" cy="180" r="260" fill="url(#cyanHalo)"/><circle cx="1130" cy="40" r="260" fill="url(#purpleHalo)"/>
<path class="waveMove" d="M0 307C180 250 315 345 505 300S835 248 1280 298" fill="none" stroke="#22d3ee" stroke-opacity=".13" stroke-width="2"/>
<path class="waveMove" d="M0 330C230 286 360 356 560 316S900 280 1280 318" fill="none" stroke="#8b5cf6" stroke-opacity=".11" stroke-width="2"/>
