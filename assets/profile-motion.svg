<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Perfil técnico em movimento</title><desc id="desc">Uma malha de conexões destaca áreas de estudo e projetos técnicos em evolução.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10192c"/><stop offset="1" stop-color="#1f3048"/></linearGradient></defs>
  <style>.signal{animation:signal 4.8s cubic-bezier(.23,1,.32,1) infinite}.card{animation:card 4.8s ease-in-out infinite}.c2{animation-delay:.5s}.c3{animation-delay:1s}@keyframes signal{0%,10%{opacity:0;transform:translate(0,0)}18%,34%{opacity:1;transform:translate(162px,0)}42%,58%{opacity:1;transform:translate(325px,62px)}66%,100%{opacity:0;transform:translate(325px,62px)}}@keyframes card{0%,100%{opacity:.74;transform:translateY(0)}38%,58%{opacity:1;transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <rect width="1280" height="420" rx="30" fill="url(#bg)"/><circle cx="1150" cy="76" r="150" fill="#7c3aed" opacity=".1"/><circle cx="78" cy="390" r="150" fill="#22d3ee" opacity=".08"/>
  <g transform="translate(82 105)"><circle cx="82" cy="102" r="64" fill="#152d49" stroke="#58c8dc" stroke-width="3"/><path d="M56 118l28-72 24 42 24-42" fill="none" stroke="#c6f6ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="88" font-family="Arial, sans-serif" font-size="28" fill="#edf8ff" font-weight="700">Tecnologia em construção</text><text x="176" y="124" font-family="Arial, sans-serif" font-size="17" fill="#a9c1d9">segurança, automação e desenvolvimento web</text></g>
  <path d="M414 250H568M710 250H864" stroke="#5fa9c5" stroke-width="3" stroke-dasharray="7 10" opacity=".75"/>
  <g class="card"><rect x="414" y="198" width="154" height="104" rx="18" fill="#1b3552" stroke="#3f7596"/><circle cx="450" cy="236" r="12" fill="#61d6df"/><rect x="476" y="228" width="57" height="9" rx="4" fill="#e8f8ff"/><rect x="438" y="260" width="83" height="8" rx="4" fill="#9fc3d2"/></g>
  <g class="card c2"><rect x="710" y="198" width="154" height="104" rx="18" fill="#263451" stroke="#636c9e"/><circle cx="746" cy="236" r="12" fill="#b2a3ff"/><rect x="772" y="228" width="57" height="9" rx="4" fill="#f0eeff"/><rect x="734" y="260" width="83" height="8" rx="4" fill="#bdb8df"/></g>
  <g class="card c3"><rect x="864" y="198" width="154" height="104" rx="18" fill="#1f4843" stroke="#4f9184"/><circle cx="900" cy="236" r="12" fill="#91e4bb"/><rect x="926" y="228" width="57" height="9" rx="4" fill="#effff5"/><rect x="888" y="260" width="83" height="8" rx="4" fill="#b1d4c3"/></g>
  <g class="signal"><circle cx="400" cy="250" r="10" fill="#f6c65b"/><circle cx="400" cy="250" r="4" fill="#fff7d9"/></g>
</svg>
