  <rect x="0" y="55" width="7" height="155" rx="4" fill="url(#accent)"/>
  <text x="32" y="96" font-family="Segoe UI,Arial,sans-serif" font-size="49" font-weight="800" letter-spacing="1" fill="#f8fafc">KAWÃ <tspan fill="#60a5fa">SILVA</tspan></text>
  <text x="34" y="134" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#dbeafe">Desenvolvedor Full Stack • Backend • Segurança da Informação</text>
  <text x="34" y="177" font-family="monospace" font-size="13" letter-spacing="2" fill="#7dd3fc">BUILD / LEARN / SECURE / AUTOMATE</text>
</g>
<g fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity=".65"><path class="flow" d="M560 108h105q38 0 38 38v42q0 26 30 26h42"/><path class="flow" d="M560 259h90q35 0 35-31v-10q0-25 30-25h60"/></g>
<g fill="#22d3ee" filter="url(#glow)"><circle class="pulse" cx="560" cy="108" r="5"/><circle class="pulse" cx="560" cy="259" r="5"/><circle class="pulse" cx="775" cy="214" r="5"/></g>
<g class="terminalGlow" transform="translate(790 55)">
  <rect width="420" height="246" rx="18" fill="#071521" stroke="#155e75" stroke-width="1.5"/>
  <path d="M0 45h420" stroke="#164e63"/>
  <circle cx="22" cy="23" r="5" fill="#fb7185"/><circle cx="41" cy="23" r="5" fill="#fbbf24"/><circle cx="60" cy="23" r="5" fill="#34d399"/>
  <text x="82" y="28" font-family="monospace" font-size="12" fill="#93c5fd">kawa@dev:~/profile</text>
  <g font-family="monospace" font-size="14">
    <text x="24" y="80" fill="#22d3ee">$</text><text x="42" y="80" fill="#e2e8f0">whoami</text>
    <text x="24" y="106" fill="#bfdbfe">Kawã Silva</text>
    <text x="24" y="145" fill="#22d3ee">$</text><text x="42" y="145" fill="#e2e8f0">focus --current</text>
    <text x="24" y="171" fill="#bfdbfe">full-stack | security | automation</text>
    <text x="24" y="208" fill="#22d3ee">$</text><text x="42" y="208" fill="#e2e8f0">status</text>
    <text x="24" y="232" fill="#34d399">learning, building, documenting...</text><rect class="cursor" x="326" y="218" width="8" height="17" rx="1" fill="#22d3ee"/>
  </g>
</g>
<text class="heroPulse" x="65" y="329" font-family="monospace" font-size="11" letter-spacing="1.4" fill="#64748b">TYPESCRIPT • PYTHON • NODE.JS • REACT • LINUX • DEVSECOPS</text>
</svg>