  <g><rect width="330" height="170" rx="18" fill="#0b1827" stroke="#155e75"/><text x="20" y="36" font-size="21" fill="#22d3ee">▣</text><text x="52" y="36" font-size="18" font-weight="800" fill="#f8fafc">Lola Aço Inox</text><text x="20" y="63" font-size="13" fill="#7dd3fc">Loja + administração</text><text x="20" y="91" font-size="13" fill="#cbd5e1">Catálogo, APIs, painel separado</text><text x="20" y="111" font-size="13" fill="#cbd5e1">e controle de acesso.</text><rect x="20" y="132" width="55" height="22" rx="11" fill="#13233a"/><text x="32" y="147" font-size="11" fill="#bfdbfe">React</text><rect x="83" y="132" width="82" height="22" rx="11" fill="#13233a"/><text x="94" y="147" font-size="11" fill="#bfdbfe">TypeScript</text><rect x="173" y="132" width="43" height="22" rx="11" fill="#13233a"/><text x="185" y="147" font-size="11" fill="#bfdbfe">API</text></g>
