  <g transform="translate(350 190)"><rect width="330" height="170" rx="18" fill="#0b1827" stroke="#2563eb"/><text x="20" y="36" font-size="21" fill="#60a5fa">◎</text><text x="52" y="36" font-size="18" font-weight="800" fill="#f8fafc">Agentes de IA</text><text x="20" y="63" font-size="13" fill="#93c5fd">Automação em Python</text><text x="20" y="91" font-size="13" fill="#cbd5e1">Agentes de terminal, papéis, síntese</text><text x="20" y="111" font-size="13" fill="#cbd5e1">de planos, Bash e IA local.</text><rect x="20" y="132" width="58" height="22" rx="11" fill="#13233a"/><text x="31" y="147" font-size="11" fill="#bfdbfe">Python</text><rect x="86" y="132" width="48" height="22" rx="11" fill="#13233a"/><text x="97" y="147" font-size="11" fill="#bfdbfe">Bash</text><rect x="142" y="132" width="35" height="22" rx="11" fill="#13233a"/><text x="153" y="147" font-size="11" fill="#bfdbfe">IA</text></g>
  <g transform="translate(700 190)"><rect width="336" height="170" rx="18" fill="#0b1827" stroke="#7c3aed"/><text x="20" y="36" font-size="21" fill="#c084fc">◇</text><text x="52" y="36" font-size="18" font-weight="800" fill="#f8fafc">eShark</text><text x="20" y="63" font-size="13" fill="#c4b5fd">Comparação de ofertas</text><text x="20" y="91" font-size="13" fill="#cbd5e1">Web/PWA para preço, frete, prazo</text><text x="20" y="111" font-size="13" fill="#cbd5e1">e validação de dados.</text><rect x="20" y="132" width="42" height="22" rx="11" fill="#18213a"/><text x="31" y="147" font-size="11" fill="#ddd6fe">PWA</text><rect x="70" y="132" width="76" height="22" rx="11" fill="#18213a"/><text x="81" y="147" font-size="11" fill="#ddd6fe">JavaScript</text><rect x="154" y="132" width="43" height="22" rx="11" fill="#18213a"/><text x="166" y="147" font-size="11" fill="#ddd6fe">API</text></g>
